<!DOCTYPE html>
<html lang="en" data-theme="modus-modern-light" data-mode="light" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var mode = "light";
        document.documentElement.setAttribute("data-theme", "modus-modern-light");
        document.documentElement.setAttribute("data-mode", mode);
        document.documentElement.classList.add(mode);
        localStorage.setItem(
          "modus-theme-config",
          JSON.stringify({ theme: "modus-modern", mode: mode })
        );
      })();
    </script>
    <meta
      name="description"
      content="AI Vibe Coding Workshop for designers — build prototypes with AI. 17–18 Aug 2026, Chennai + virtual."
    />
